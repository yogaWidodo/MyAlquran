# ============================================================================
# FASE 2 - caller. Meniru bentuk cd.yaml di kantor, tapi berhenti di assemble.
#
# Bentuk asli di kantor: ci -> sit -> (uat, prd-apk) -> prd-aab, memanggil
# reusable workflow LINTAS-REPO di self-hosted runner. Di sini rantainya
# disederhanakan jadi sit -> (uat, prod) dan reusable-nya lokal.
#
# DETAIL YANG SENGAJA DIPERTAHANKAN, JANGAN "DIBETULKAN":
#   Blok `secrets:` di bawah ditulis EKSPLISIT, bukan `secrets: inherit`.
#   Itu kondisi asli di kantor dan justru itu yang bikin Fase 0 jadi
#   pertanyaan. Mengubahnya jadi `inherit` menghapus hal yang mau dilatih.
#
# Fase 0 membuktikan ekspresi `${{ secrets.* }}` di blok ini ter-resolve
# mengikuti environment job yang dipanggil, walaupun job caller sendiri tidak
# punya `environment:`. Jadi nilainya cukup disimpan sebagai environment
# secret biasa - tidak perlu repository secret ber-suffix per-env.
#
# workflow_dispatch ONLY - tidak pernah jalan sendiri saat push.
# ============================================================================
name: cd

on:
  workflow_dispatch:
    inputs:
      BUILD_TYPE:
        description: "Debug menghasilkan APK ter-sign debug (bisa langsung dipasang). Release menghasilkan APK unsigned."
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

jobs:
  sit:
    name: SIT
    uses: ./.github/workflows/build-android.yaml
    with:
      ENVIRONMENT: SIT
      COMMAND_BUILD: assembleSit${{ inputs.BUILD_TYPE }}
    secrets:
      VIDA_REPO_KEY: ${{ secrets.VIDA_REPO_KEY }}
      VIDA_API_KEY: ${{ secrets.VIDA_API_KEY }}
      VIDA_LICENSE_KEY: ${{ secrets.VIDA_LICENSE_KEY }}
      VIDA_ACTIVATION_KEY: ${{ secrets.VIDA_ACTIVATION_KEY }}
      VIDA_REPO_URL_SANDBOX: ${{ secrets.VIDA_REPO_URL_SANDBOX }}
      VIDA_REPO_URL_PROD: ${{ secrets.VIDA_REPO_URL_PROD }}
      VIDA_REPO_GROUP: ${{ secrets.VIDA_REPO_GROUP }}

  uat:
    name: UAT
    needs: sit
    uses: ./.github/workflows/build-android.yaml
    with:
      ENVIRONMENT: UAT
      COMMAND_BUILD: assembleUat${{ inputs.BUILD_TYPE }}
    secrets:
      VIDA_REPO_KEY: ${{ secrets.VIDA_REPO_KEY }}
      VIDA_API_KEY: ${{ secrets.VIDA_API_KEY }}
      VIDA_LICENSE_KEY: ${{ secrets.VIDA_LICENSE_KEY }}
      VIDA_ACTIVATION_KEY: ${{ secrets.VIDA_ACTIVATION_KEY }}
      VIDA_REPO_URL_SANDBOX: ${{ secrets.VIDA_REPO_URL_SANDBOX }}
      VIDA_REPO_URL_PROD: ${{ secrets.VIDA_REPO_URL_PROD }}
      VIDA_REPO_GROUP: ${{ secrets.VIDA_REPO_GROUP }}

  prod:
    name: PROD
    # JOB INI AKAN GAGAL, DAN ITU DISENGAJA.
    # Environment PROD sengaja tidak diberi credential - yang produksi belum
    # ada, dan mengisinya dengan credential sandbox justru berbahaya karena
    # build prod jadi diam-diam memakai kredensial sandbox.
    #
    # Guard credential di build-android.yaml akan berhenti dengan pesan yang
    # menyebut persis secret mana yang kosong. Job merah di sini adalah
    # penanda pekerjaan yang belum selesai, bukan kerusakan.
    needs: sit
    uses: ./.github/workflows/build-android.yaml
    with:
      ENVIRONMENT: PROD
      # Flavor tetap EKSPLISIT. JANGAN diganti jadi `assembleRelease` - task
      # agregat itu justru yang memicu jebakan isProdBuild.
      COMMAND_BUILD: assembleProd${{ inputs.BUILD_TYPE }}
    secrets:
      VIDA_REPO_KEY: ${{ secrets.VIDA_REPO_KEY }}
      VIDA_API_KEY: ${{ secrets.VIDA_API_KEY }}
      VIDA_LICENSE_KEY: ${{ secrets.VIDA_LICENSE_KEY }}
      VIDA_ACTIVATION_KEY: ${{ secrets.VIDA_ACTIVATION_KEY }}
      VIDA_REPO_URL_SANDBOX: ${{ secrets.VIDA_REPO_URL_SANDBOX }}
      VIDA_REPO_URL_PROD: ${{ secrets.VIDA_REPO_URL_PROD }}
      VIDA_REPO_GROUP: ${{ secrets.VIDA_REPO_GROUP }}
