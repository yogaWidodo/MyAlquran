# ============================================================================
# FASE 0 — EKSPERIMEN / SANDBOX. Tidak ada hubungannya dengan build aplikasi.
#
# Pertanyaan yang dibuktikan file ini:
#   Apakah GitHub *Environment secret* bisa dibaca dari dalam reusable
#   workflow HANYA karena job-nya punya `environment:`, TANPA:
#     (a) di-declare di `on.workflow_call.secrets`, dan
#     (b) di-forward eksplisit dari caller?
#
# Desain eksperimen — file ini punya 2 job yang ISINYA IDENTIK,
# beda satu baris saja:
#   - job `with_environment`    -> punya `environment: ${{ inputs.ENVIRONMENT }}`
#   - job `without_environment` -> TIDAK punya `environment:`   (kontrol)
# Kalau job pertama OK dan job kedua MISS, maka `environment:` lah penyebabnya,
# bukan hal lain.
#
# Kontrol tambahan: `PROBE_KEY_MISSING` sengaja TIDAK pernah dibuat di mana pun,
# supaya terbukti probe ini memang mampu melaporkan MISS.
#
# ATURAN KEAMANAN: nilai secret TIDAK PERNAH di-print. Hanya panjang string.
# ============================================================================
name: probe-env-secret (reusable)

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "Nama GitHub Environment yang di-attach ke job probe"
        required: true
        type: string

    # >>> INTI EKSPERIMEN <<<
    # Sengaja TIDAK ADA blok `secrets:` di sini. Jangan ditambahkan —
    # begitu ditambah, eksperimennya kehilangan maknanya.

permissions: {}

jobs:
  with_environment:
    name: WITH environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENVIRONMENT }}
    steps:
      - name: Probe secret presence (nilai tidak pernah di-print)
        env:
          PROBE_MODE: "WITH environment"
          PROBE_ENV_INPUT: ${{ inputs.ENVIRONMENT }}
          PROBE_ENV_ATTACHED: "YES"
          PROBE_KEY_A: ${{ secrets.PROBE_KEY_A }}
          PROBE_KEY_B: ${{ secrets.PROBE_KEY_B }}
          PROBE_KEY_MISSING: ${{ secrets.PROBE_KEY_MISSING }}
        run: |
          report() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              status="OK (len=${#value})"
            else
              status="MISS"
            fi
            printf '%-18s : %s\n' "$name" "$status"
            printf '| `%s` | %s |\n' "$name" "$status" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            printf '### %s\n\n' "$PROBE_MODE"
            printf '- environment input: `%s`\n' "$PROBE_ENV_INPUT"
            printf '- `environment:` block attached: **%s**\n\n' "$PROBE_ENV_ATTACHED"
            printf '| secret | status |\n| --- | --- |\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "mode              : $PROBE_MODE"
          echo "environment input : $PROBE_ENV_INPUT"
          echo "env block attached: $PROBE_ENV_ATTACHED"
          echo "run repo          : $GITHUB_REPOSITORY"
          echo "------------------------------------------------"
          report PROBE_KEY_A       "$PROBE_KEY_A"
          report PROBE_KEY_B       "$PROBE_KEY_B"
          report PROBE_KEY_MISSING "$PROBE_KEY_MISSING"

          printf '\n' >> "$GITHUB_STEP_SUMMARY"

  without_environment:
    name: WITHOUT environment (kontrol)
    runs-on: ubuntu-latest
    # Sengaja TIDAK ada `environment:` di sini — ini job pembanding.
    steps:
      - name: Probe secret presence (nilai tidak pernah di-print)
        env:
          PROBE_MODE: "WITHOUT environment (kontrol)"
          PROBE_ENV_INPUT: ${{ inputs.ENVIRONMENT }}
          PROBE_ENV_ATTACHED: "NO"
          PROBE_KEY_A: ${{ secrets.PROBE_KEY_A }}
          PROBE_KEY_B: ${{ secrets.PROBE_KEY_B }}
          PROBE_KEY_MISSING: ${{ secrets.PROBE_KEY_MISSING }}
        run: |
          report() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              status="OK (len=${#value})"
            else
              status="MISS"
            fi
            printf '%-18s : %s\n' "$name" "$status"
            printf '| `%s` | %s |\n' "$name" "$status" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            printf '### %s\n\n' "$PROBE_MODE"
            printf '- environment input: `%s` (tidak dipakai job ini)\n' "$PROBE_ENV_INPUT"
            printf '- `environment:` block attached: **%s**\n\n' "$PROBE_ENV_ATTACHED"
            printf '| secret | status |\n| --- | --- |\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "mode              : $PROBE_MODE"
          echo "environment input : $PROBE_ENV_INPUT (tidak dipakai job ini)"
          echo "env block attached: $PROBE_ENV_ATTACHED"
          echo "run repo          : $GITHUB_REPOSITORY"
          echo "------------------------------------------------"
          report PROBE_KEY_A       "$PROBE_KEY_A"
          report PROBE_KEY_B       "$PROBE_KEY_B"
          report PROBE_KEY_MISSING "$PROBE_KEY_MISSING"

          printf '\n' >> "$GITHUB_STEP_SUMMARY"
